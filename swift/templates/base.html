<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SwiftConnect{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: radial-gradient(circle at top, #11131f 0%, #05070f 38%, #020205 100%);
            color: #e8ebff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 10% 20%, rgba(212, 175, 55, 0.12), transparent 12%),
                        radial-gradient(circle at 80% 15%, rgba(255, 255, 255, 0.06), transparent 14%),
                        radial-gradient(circle at 50% 80%, rgba(93, 143, 255, 0.08), transparent 18%);
            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(#ffffff08 1px, transparent 1px);
            background-size: 120px 120px;
            opacity: 0.12;
            pointer-events: none;
            z-index: -1;
        }

        .dashboard-shell {
            width: min(1400px, 100%);
            margin: 0 auto;
            padding: 24px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px 28px;
            background: rgba(14, 18, 36, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
            margin-bottom: 24px;
        }

        .logo {
            font-size: 1rem;
            letter-spacing: 0.36em;
            text-transform: uppercase;
            color: #ffe17d;
            font-weight: 800;
            text-shadow: 0 0 18px rgba(212, 175, 55, 0.45);
        }

        .user-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .user-chip {
            padding: 10px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #eef2ff;
            font-size: 0.95rem;
        }

        .btn-logout {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            border-radius: 999px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.17), rgba(255, 215, 0, 0.08));
            border: 1px solid rgba(212, 175, 55, 0.24);
            color: #111;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 0 24px rgba(212, 175, 55, 0.18);
        }

        .btn-logout:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 28px rgba(212, 175, 55, 0.28);
        }

        .dashboard-grid {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .sidebar {
            width: 280px;
            flex-shrink: 0;
            background: rgba(11, 15, 32, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px;
            padding: 26px;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.42);
            position: sticky;
            top: 24px;
            height: fit-content;
        }

        .sidebar-brand {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 0;
            margin-bottom: 28px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f7e6a8;
            letter-spacing: 0.2em;
            font-size: 0.95rem;
            text-shadow: 0 0 14px rgba(212, 175, 55, 0.35);
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            color: #c8cddb;
            transition: all 0.25s ease;
            text-decoration: none;
        }

        .sidebar-menu a:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            box-shadow: 0 0 18px rgba(255, 255, 255, 0.08);
        }

        .sidebar-menu a.active {
            background: rgba(212, 175, 55, 0.18);
            border-color: rgba(212, 175, 55, 0.32);
            color: #ffffff;
            box-shadow: 0 0 26px rgba(212, 175, 55, 0.22);
        }

        .sidebar-menu a.blue.active {
            background: rgba(93, 143, 255, 0.18);
            border-color: rgba(93, 143, 255, 0.28);
            box-shadow: 0 0 26px rgba(93, 143, 255, 0.22);
        }

        .sidebar-menu a.cyan.active {
            background: rgba(60, 207, 255, 0.18);
            border-color: rgba(60, 207, 255, 0.28);
            box-shadow: 0 0 26px rgba(60, 207, 255, 0.22);
        }

        .sidebar-menu a.purple.active {
            background: rgba(153, 102, 255, 0.18);
            border-color: rgba(153, 102, 255, 0.28);
            box-shadow: 0 0 26px rgba(153, 102, 255, 0.22);
        }

        .sidebar-menu .icon {
            width: 32px;
            height: 32px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #f8e8af;
        }

        .dashboard-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .hero-panel,
        .panel,
        .history-panel {
            padding: 28px 32px;
            border-radius: 32px;
            background: rgba(12, 18, 34, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.38);
        }

        .hero-tag {
            font-size: 0.82rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #8e97b6;
            margin-bottom: 14px;
        }

        .hero-title,
        .panel-title {
            font-size: clamp(2rem, 4vw, 3.4rem);
            line-height: 1.05;
            color: #fff7d5;
            margin-bottom: 16px;
        }

        .hero-copy,
        .panel-copy,
        .history-copy {
            font-size: 1rem;
            line-height: 1.8;
            color: #c9cee3;
            max-width: 760px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 18px;
        }

        .stat-card {
            padding: 24px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(14px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
        }

        .stat-card.gold {
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.18), rgba(212, 175, 55, 0.06));
            border-color: rgba(212, 175, 55, 0.22);
        }

        .stat-card.blue {
            background: linear-gradient(180deg, rgba(93, 143, 255, 0.18), rgba(93, 143, 255, 0.06));
            border-color: rgba(93, 143, 255, 0.22);
        }

        .stat-card.purple {
            background: linear-gradient(180deg, rgba(153, 102, 255, 0.16), rgba(153, 102, 255, 0.06));
            border-color: rgba(171, 122, 255, 0.22);
        }

        .stat-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            color: #d4d8ef;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
        }

        .stat-icon {
            width: 42px;
            height: 42px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: currentColor;
        }

        .stat-value {
            font-size: 2.3rem;
            font-weight: 800;
            color: #fff2b2;
            margin-bottom: 8px;
        }

        .stat-label,
        .history-label {
            font-size: 0.9rem;
            color: #9ba3c5;
            line-height: 1.5;
        }

        .history-panel {
            background: rgba(12, 18, 34, 0.94);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }

        .history-title {
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .history-note {
            color: #8f96b3;
            font-size: 0.95rem;
        }

        .history-list {
            display: grid;
            gap: 14px;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .panel-header {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .panel-tag {
            font-size: 0.82rem;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #8c9ace;
        }

        .history-item {
            padding: 18px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .history-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 38px rgba(0, 0, 0, 0.2);
        }

        .history-meta {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            color: #a3adcf;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 10px;
        }

        .history-title-strong {
            color: #f7f4d8;
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .history-subtitle {
            color: #b5b8d6;
            font-size: 0.94rem;
            line-height: 1.6;
        }

        .panel-copy {
            color: #afb5d0;
            line-height: 1.8;
            max-width: 720px;
        }

        .form-group {
            position: relative;
            margin-bottom: 22px;
            z-index: 1;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            font-size: 0.85rem;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #94a0c1;
        }

        .form-input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.05);
            color: #eef2ff;
            font-size: 0.96rem;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .form-input::placeholder {
            color: rgba(238, 242, 255, 0.54);
        }

        .form-input:hover,
        .form-input:focus {
            border-color: rgba(212, 175, 55, 0.45);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12);
            background: rgba(255, 255, 255, 0.1);
        }

        textarea.form-input {
            min-height: 140px;
            resize: vertical;
        }

        .form-hint {
            margin-top: 10px;
            font-size: 0.82rem;
            color: #7a85a3;
            line-height: 1.6;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 18px;
            z-index: 1;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 24px;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(45deg, #d4af37, #ffd700);
            color: #111;
            box-shadow: 0 18px 40px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 22px 48px rgba(212, 175, 55, 0.45);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: #eef2ff;
            border-color: rgba(255, 255, 255, 0.14);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .preview-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 460px;
        }

        .preview-box {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 28px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.03);
            position: relative;
        }

        .preview-box::after {
            content: 'QR PREVIEW';
            position: absolute;
            top: 18px;
            left: 20px;
            font-size: 0.72rem;
            letter-spacing: 0.26em;
            text-transform: uppercase;
            color: #8f96b3;
            opacity: 0.78;
        }

        .preview-thumb {
            width: 100%;
            max-width: 260px;
            aspect-ratio: 1;
            border-radius: 24px;
            background: radial-gradient(circle at center, rgba(212, 175, 55, 0.18), rgba(255, 255, 255, 0.06) 40%, transparent 70%);
            border: 1px solid rgba(212, 175, 55, 0.18);
            display: grid;
            place-items: center;
            color: #e9e6c6;
            text-align: center;
            padding: 24px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.14);
        }

        .preview-thumb img {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 0 34px rgba(212, 175, 55, 0.24);
        }

        .preview-thumb p {
            font-size: 0.95rem;
            line-height: 1.65;
        }

        .workspace {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 24px;
            align-items: start;
        }

        .glass-panel {
            background: rgba(12, 18, 34, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 32px;
            box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(22px);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.12), transparent 40%, rgba(255, 255, 255, 0.05));
            pointer-events: none;
        }

        @media (max-width: 1160px) {
            .dashboard-grid {
                flex-direction: column;
            }

            .sidebar {
                position: relative;
                top: 0;
            }

            .workspace {
                grid-template-columns: 1fr;
            }

            .preview-panel {
                min-height: auto;
            }
        }

        @media (max-width: 820px) {
            .dashboard-shell {
                padding: 18px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .hero-title {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-shell">
        <div class="topbar">
            <div class="logo">SWIFT CONNECT</div>
            <div class="user-actions">
                <div class="user-chip">{{ user_email }}</div>
                <a href="{{ url_for('logout') }}" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </div>

        <div class="dashboard-grid">
            <aside class="sidebar">
                <div class="sidebar-brand">SWIFT CONNECT</div>
                <nav class="sidebar-menu">
                    <a href="{{ url_for('dashboard') }}" class="menu-item gold {% if active_page == 'dashboard' %}active{% endif %}"><span class="icon"><i class="fas fa-tachometer-alt"></i></span>Dashboard</a>
                    <a href="{{ url_for('generate') }}" class="menu-item blue {% if active_page == 'generate' %}active{% endif %}"><span class="icon"><i class="fas fa-qrcode"></i></span>Generate QR</a>
                    <a href="{{ url_for('vehicles') }}" class="menu-item cyan {% if active_page == 'vehicles' %}active{% endif %}"><span class="icon"><i class="fas fa-car-side"></i></span>My Vehicles</a>
                    <a href="{{ url_for('owner_chats') }}" class="menu-item gold {% if active_page == 'owner_chats' %}active{% endif %}"><span class="icon"><i class="fas fa-comments"></i></span>Active Chats</a>
                    <a href="{{ url_for('history') }}" class="menu-item purple {% if active_page == 'history' %}active{% endif %}"><span class="icon"><i class="fas fa-clock"></i></span>History</a>
                    <a href="{{ url_for('logout') }}" class="menu-item"><span class="icon"><i class="fas fa-power-off"></i></span>Logout</a>
                </nav>
            </aside>

            <main class="dashboard-main">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>
</body>
</html>
