<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - Swift Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="glass-card">
        <!-- Brand Container -->
        <div class="brand-container">
            <div class="brand-header">SWIFT CONNECT</div>
            <div class="brand-logo">🚗</div>
        </div>

        <!-- Page Title -->
        <h1 class="page-title">Enter OTP</h1>
        <p class="page-subtitle">Check your email for the verification code</p>

        <!-- OTP Form -->
        <form id="otpForm" method="POST" action="{{ url_for('verify') }}">
            <!-- OTP Input Container -->
            <div class="otp-container">
                <input type="text" class="otp-input" maxlength="1" placeholder="0" required>
                <input type="text" class="otp-input" maxlength="1" placeholder="0" required>
                <input type="text" class="otp-input" maxlength="1" placeholder="0" required>
                <input type="text" class="otp-input" maxlength="1" placeholder="0" required>
                <input type="text" class="otp-input" maxlength="1" placeholder="0" required>
                <input type="text" class="otp-input" maxlength="1" placeholder="0" required>
            </div>

            <!-- Hidden OTP Field -->
            <input type="hidden" name="otp" id="otpValue">

            <!-- Action Buttons -->
            <div class="link-group">
                <a href="{{ url_for('resend_otp') }}" class="link">Resend Code</a>
            </div>

            <button type="submit" class="btn-primary">Verify</button>
        </form>

        <!-- Back to Sign In Link -->
        <p class="text-center text-muted" style="margin-top: 24px;">
            <a href="{{ url_for('login') }}" class="link">← Back to Sign In</a>
        </p>
    </div>

    <script>
        // Handle OTP input boxes
        const otpInputs = document.querySelectorAll(".otp-input");
        const otpValue = document.getElementById("otpValue");

        otpInputs.forEach((input, index) => {
            input.addEventListener("input", (e) => {
                // Auto-focus to next input
                if (input.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }

                // Combine all OTP values
                let otp = "";
                otpInputs.forEach(i => otp += i.value);
                otpValue.value = otp;
            });

            // Handle backspace
            input.addEventListener("keydown", (e) => {
                if (e.key === "Backspace" && input.value === "" && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });

            // Handle paste
            input.addEventListener("paste", (e) => {
                const pastedData = e.clipboardData.getData("text");
                if (/^\d+$/.test(pastedData) && pastedData.length <= 6) {
                    otpInputs.forEach((inp, idx) => {
                        inp.value = pastedData[idx] || "";
                    });
                    let otp = "";
                    otpInputs.forEach(i => otp += i.value);
                    otpValue.value = otp;
                }
                e.preventDefault();
            });
        });
    </script>
</body>
</html>
