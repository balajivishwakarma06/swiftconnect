<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="navbar">
    🚗 SwiftConnect Chat ({{ user_id }})
</div>

<div class="container">

    <div class="chat-box">
        {% for msg in messages %}
            {% if msg[0] == user_id %}
                <div class="msg right">
                    <b>You:</b> {{ msg[2] }}
                </div>
            {% else %}
                <div class="msg left">
                    <b>Visitor:</b> {{ msg[2] }}
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <form method="POST" class="chat-input">
        <input type="hidden" name="sender" value="{{ user_id }}">
        <input type="text" name="message" placeholder="Type a message..." required>
        <button type="submit">Send</button>
    </form>

</div>

<!-- Auto refresh -->
<script>
setInterval(() => {
    location.reload();
}, 3000);
</script>

</body>
</html>
