<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="chat-wrapper">

    <div class="chat-header">
        🚗 SwiftConnect Chat
    </div>

    <div class="chat-box">
        {% for msg in messages %}
    {% if msg[0] == user_id %}
        <div class="msg right">
            {{ msg[2] }}
            <span style="font-size:10px; color:gray;">
                {% if msg[3] == 1 %}
                    ✔✔
                {% else %}
                    ✔
                {% endif %}
            </span>
        </div>
    {% else %}
        <div class="msg left">
            {{ msg[2] }}
        </div>
    {% endif %}
{% endfor %}
    </div>

    <!-- Typing Indicator -->
    <div id="typing" style="display:none; font-size:12px; color:gray; padding:5px;">
        Typing...
    </div>

    <form method="POST" class="chat-input">
        <input type="hidden" name="sender" value="{{ user_id }}">
        <input type="text" id="messageInput" name="message" placeholder="Type a message..." required>
        <button type="submit">➤</button>
    </form>

</div>

<!-- Typing Script (Added at Bottom) -->
<script>
    const input = document.getElementById("messageInput");
    const typingIndicator = document.getElementById("typing");

    let typingTimeout;

    input.addEventListener("input", () => {
        typingIndicator.style.display = "block";

        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(() => {
            typingIndicator.style.display = "none";
        }, 1000); // hides after 1 sec of no typing
    });
</script>

</body>
</html>
