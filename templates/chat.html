<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="chat-wrapper">

    <div class="chat-header">
        🚗 SwiftConnect Chat
    </div>

    <div class="chat-box" id="chat-box"></div>

    <!-- Typing Indicator -->
    <div id="typing" style="display:none; font-size:12px; color:gray; padding:5px;">
        Typing...
    </div>

    <form method="POST" class="chat-input">
        <input type="hidden" name="sender" value="{{ user_id }}">
        <input type="text" id="messageInput" name="message" placeholder="Type a message..." required>
        <button type="submit">➤</button>
    </form>

</div>

<!-- Typing Script (Added at Bottom) -->
<script>
    const input = document.getElementById("messageInput");
    const typingIndicator = document.getElementById("typing");

    let typingTimeout;

    input.addEventListener("input", () => {
        typingIndicator.style.display = "block";

        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(() => {
            typingIndicator.style.display = "none";
        }, 1000); // hides after 1 sec of no typing
    });
</script>

<script>
function loadMessages() {
    fetch("/get_messages/{{ user_id }}")
        .then(res => res.json())
        .then(data => {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";

            data.messages.forEach(msg => {
                const div = document.createElement("div");

                if (msg[0] === "{{ user_id }}") {
                    div.className = "msg right";
                } else {
                    div.className = "msg left";
                }

                div.innerText = msg[2];
                chatBox.appendChild(div);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        });
}

// load every 2 seconds WITHOUT reload
setInterval(loadMessages, 2000);

// load first time
loadMessages();
</script>

</body>
</html>
