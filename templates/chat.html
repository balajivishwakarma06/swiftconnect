<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
</head>
<body>

<h2>Chat with {{ user_id }}</h2>

<form method="POST">
    <input type="hidden" name="sender" value="{{ user_id }}">
    <input type="text" name="message" placeholder="Type message"><br><br>
    <button type="submit">Send</button>
</form>

<hr>

<h3>Messages:</h3>

<ul id="chat-box">
{% for msg in messages %}
    {% if msg[0] == "Visitor" %}
        <li><b>You:</b> {{ msg[2] }}</li>
    {% else %}
        <li><b>Owner:</b> {{ msg[2] }}</li>
    {% endif %}
{% endfor %}
</ul>

<!-- 🔥 AUTO UPDATE SCRIPT (NO REFRESH) -->
<script>
setInterval(function(){
    fetch(window.location.href)
    .then(response => response.text())
    .then(html => {
        let parser = new DOMParser();
        let doc = parser.parseFromString(html, 'text/html');
        let newMessages = doc.querySelector("#chat-box").innerHTML;
        document.querySelector("#chat-box").innerHTML = newMessages;
    });
}, 2000);
</script>

</body>
</html>
