<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SwiftConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15), 0 0 60px rgba(102, 126, 234, 0.08);
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        .card:hover {
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.2), 0 0 80px rgba(102, 126, 234, 0.12);
            transform: translateY(-2px);
        }

        .google-card {
            text-align: center;
        }

        .google-title {
            font-size: 28px;
            font-weight: 600;
            color: #202124;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .google-subtitle {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 32px;
            font-weight: 400;
        }

        form {
            margin-bottom: 24px;
        }

        .input-field {
            width: 100%;
            padding: 14px 12px;
            margin: 12px 0;
            border: 1px solid #dadce0;
            border-radius: 6px;
            font-size: 14px;
            color: #202124;
            background: #f8f9fa;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .input-field:hover {
            background: #f0f1f3;
            border-color: #c6c6c6;
        }

        .input-field:focus {
            outline: none;
            background: white;
            border-color: #4285F4;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }

        .input-field::placeholder {
            color: #9aa0a6;
        }

        .btn-primary {
            width: 100%;
            padding: 12px 24px;
            margin-top: 16px;
            background: linear-gradient(135deg, #667eea 0%, #5568d3 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #5568d3 0%, #4557bd 100%);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.4);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            font-size: 13px;
            color: #5f6368;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dadce0;
        }

        .divider::before {
            margin-right: 12px;
        }

        .divider::after {
            margin-left: 12px;
        }

        .google-btn {
            width: 100%;
            padding: 12px 0;
            border: 1px solid #dadce0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #202124;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s ease;
            margin-bottom: 24px;
        }

        .google-btn:hover {
            background: #f8f9fa;
            border-color: #c6c6c6;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .google-btn:active {
            background: #f0f1f3;
        }

        .signup-text {
            font-size: 14px;
            color: #5f6368;
            margin-bottom: 12px;
        }

        .signup-text a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .signup-text a:hover {
            color: #1666c1;
            text-decoration: underline;
        }

        .back-home {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
        }

        .back-link {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .back-link:hover {
            color: #1666c1;
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .card {
                padding: 32px 24px;
            }

            .google-title {
                font-size: 24px;
            }

            .google-subtitle {
                margin-bottom: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="card google-card">

    <h2 class="google-title">Sign in</h2>
    <p class="google-subtitle">to continue to SwiftConnect</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert {% if category == 'error' %}alert-error{% elif category == 'success' %}alert-success{% else %}alert-error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
        <input type="email" name="email" placeholder="Email" required class="input-field">
        <input type="password" name="password" placeholder="Password" required class="input-field">

        <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <div class="divider">OR</div>

    <button class="google-btn" type="button" disabled style="opacity: 0.6; cursor: not-allowed;">
        <i class="fab fa-google" style="color: #1f2937;"></i>
        Sign in with Google (Coming Soon)
    </button>

    <p class="signup-text">
        New user? <a href="{{ url_for('auth') }}">Create account</a>
    </p>

    <p class="back-home">
        <a href="{{ url_for('home') }}" class="back-link">← Back to Home</a>
    </p>

</div>

</body>
</html>
