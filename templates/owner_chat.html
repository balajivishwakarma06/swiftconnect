<!DOCTYPE html>
<html>
<head>
    <title>Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="whatsapp">

    <!-- LEFT SIDEBAR -->
    <div class="wa-sidebar">
        <div class="wa-header">Chats</div>

        {% for u in [visitor_id] %}
        <div class="wa-user active">
            👤 {{ u }}
        </div>
        {% endfor %}
    </div>

    <!-- RIGHT CHAT -->
    <div class="wa-chat">

        <!-- TOP BAR -->
        <div class="wa-top">
            👤 {{ visitor_id }}
        </div>

        <!-- CHAT AREA -->
        <div class="wa-messages" id="chat-box"></div>

        <!-- INPUT -->
        <form method="POST" class="wa-input">
            <input type="text" name="message" placeholder="Type a message" required>
            <button type="submit">➤</button>
        </form>

    </div>

</div>

<!-- AUTO LOAD -->
<script>
function loadMessages() {
    fetch("/get_messages/{{ user_id }}/{{ visitor_id }}")
        .then(res => res.json())
        .then(data => {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = "";

            data.messages.forEach(msg => {
                const div = document.createElement("div");

                if (msg[0] === "{{ user_id }}") {
                    div.className = "bubble right";
                    div.innerText = msg[2];
                } else {
                    div.className = "bubble left";
                    div.innerText = msg[2];
                }

                chatBox.appendChild(div);
            });

            chatBox.scrollTop = chatBox.scrollHeight;
        });
}

setInterval(loadMessages, 1000);
loadMessages();
</script>

</body>
</html>
